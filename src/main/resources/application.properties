# ============================================================
# Spring Boot 配置文件
# 原来这些信息是写死在 DatabaseUtil.java 里的（DB_URL / DB_USER / DB_PASSWORD 三个常量），
# 现在搬到配置文件，改数据库地址不用改代码、不用重新编译。
# ============================================================

server.port=8080

# ---------- 数据库连接 ----------
# 这四项对应原来的 DatabaseUtil.java：
#   jdbc:mysql://localhost:3306/wechat_ordering  +  root / root
spring.datasource.url=jdbc:mysql://localhost:3306/wechat_ordering?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- 数据库连接池 ----------
# 原来 DatabaseUtil 每次调用都 DriverManager.getConnection()，也就是「每次查库新建一个连接」，
# 用完就关。开一个 TCP 连接是有成本的（握手、认证），高并发下这就是瓶颈。
#
# 连接池的思路：启动时先建好几个连接放在池子里，用的时候借、用完还，不真的关。
# Spring Boot 默认用 HikariCP（业界性能最好的 Java 连接池之一），不写这些配置也能跑，
# 这里写出来是为了让你知道「它存在、可以调」。
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ---------- MyBatis（阶段 2 新增）----------
# Mapper 的 XML 文件放在哪。classpath:mapper/ 对应 src/main/resources/mapper/
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类的包名，配了以后 XML 里写 resultType="Dish" 就行，不用写全限定名
mybatis.type-aliases-package=com.ordering.model
# ★ 关键配置：开启「下划线转驼峰」
#   数据库列 create_time  →  Java 字段 createTime
#   数据库列 order_number →  Java 字段 orderNumber
#   不开这个，你就得给每个字段手写一遍映射，20 个字段写 20 行。
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- Thymeleaf 模板引擎 ----------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
# 开发阶段关掉缓存：改了 html 刷新浏览器就能看到效果，不用重启
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ---------- 管理员账号 ----------
# 用途：保护 /order（全部订单列表）和 /order/{id}/status（改订单状态）
# 不配这两项的话，默认是 admin / admin123（见 AdminController 的 @Value 默认值）
#
# ⚠️ 部署到公网之前【必须改掉】，而且不要提交到公开仓库。
#    生产环境的正确做法是：
#      1. 账号密码存数据库，密码用 BCrypt 哈希（不要明文）
#      2. 通过环境变量注入，不写进配置文件
#      3. 加登录失败次数限制（本项目已做简单的内存计数，但重启就清零）
app.admin.username=admin
app.admin.password=admin123

# ---------- 日志 ----------
logging.level.com.ordering=debug
# ★ 这一行让 MyBatis 把实际执行的 SQL 打到控制台。
#   你会看到类似：
#     ==>  Preparing: SELECT * FROM dish WHERE active = true ORDER BY category, id
#     ==> Parameters:
#     <==      Total: 20
#   面试被问「怎么排查 SQL 问题」，答「开 Mapper 层的 debug 日志看实际执行的 SQL」。
logging.level.com.ordering.mapper=debug

<!DOCTYPE html>
<!--
  订单列表（管理端）
  前身：WebContent/WEB-INF/views/order-list.jsp（364 行）
  老地址：/order?action=list
  新地址：/order

  这一页有个 JSP 特有的写法要专门讲：
      老代码：${fn:substring(order.createTime, 0, 19)}
      它是在「页面里」把 Timestamp 转成字符串再截取前 19 位，属于典型的视图层做业务。

      新代码：用 Thymeleaf 内置的 #dates 工具类格式化
      #dates 是 Thymeleaf 提供的日期工具，format 方法按指定格式输出，
      比 fn:substring 截字符串准确得多（截字符串遇到不同时区/格式就会错位）。
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 微信点餐系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #07c160 0%, #06ad56 100%); color: white; padding: 20px; text-align: center; position: relative; }
        .header h1 { font-size: 22px; font-weight: 600; }
        .back-btn { position: absolute; left: 20px; top: 24px; color: white; text-decoration: none; font-size: 16px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        .message { background: #4caf50; color: white; padding: 14px 20px; border-radius: 8px; margin-bottom: 16px; text-align: center; font-size: 14px; }
        .message-error { background: #e74c3c; }

        .order-card { background: white; border-radius: 12px; margin-bottom: 14px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .order-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: #fafafa; border-bottom: 1px solid #f0f0f0; }
        .order-number { font-weight: 600; font-size: 14px; }
        .order-time { color: #999; font-size: 12px; margin-left: 12px; }

        .order-status { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; background: #eef6ff; color: #2b7fd4; }
        .status-待确认 { background: #fff4e5; color: #e67e22; }
        .status-已确认 { background: #eef6ff; color: #2b7fd4; }
        .status-制作中 { background: #f3e9ff; color: #8e44ad; }
        .status-已配送 { background: #e9f7ff; color: #16a085; }
        .status-已完成 { background: #e8f8ef; color: #07a052; }
        .status-已取消 { background: #f2f2f2; color: #999; }

        .order-body { padding: 16px 18px; display: flex; gap: 24px; }
        .customer-info { flex: 0 0 200px; }
        .customer-info h4 { font-size: 15px; margin-bottom: 6px; }
        .customer-info p { color: #888; font-size: 13px; margin-bottom: 3px; }
        .order-items { flex: 1; }
        .order-item { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; color: #555; }
        .item-qty { color: #999; }
        .item-price { color: #ff6b6b; }

        .order-footer { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-top: 1px solid #f0f0f0; }
        .order-total { font-size: 15px; }
        .order-total strong { color: #ff6b6b; font-size: 20px; }
        .status-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .status-actions form { display: inline; }
        .btn { border: none; padding: 7px 14px; border-radius: 16px; font-size: 13px; cursor: pointer; background: #f0f0f0; color: #555; }
        .btn:hover { background: #e5e5e5; }
        .btn-primary { background: #07c160; color: white; }
        .btn-primary:hover { background: #06ad56; }
        .btn-link { color: #07c160; text-decoration: none; font-size: 13px; }

        .empty-state { text-align: center; padding: 80px 20px; background: white; border-radius: 12px; color: #888; }
        .empty-state .icon { font-size: 80px; margin-bottom: 16px; }

        @media (max-width: 768px) {
            .order-body { flex-direction: column; gap: 12px; }
            .customer-info { flex: none; }
            .order-footer { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>

<div class="header">
    <a th:href="@{/}" class="back-btn">← 返回首页</a>
    <h1>📋 订单管理</h1>

    <!--
      ★ 退出登录按钮。这是个 POST 表单，不是 <a href>。
      因为「退出」改变了服务器状态（清掉 session 里的登录标记），
      按阶段 1 讲的规矩，改变状态的操作用 POST。

      如果写成 <a href="/admin/logout">，会有个实际问题：
      别人在你页面上放一个 <img src="你的站点/admin/logout">，
      你打开那个页面就被强制退出了（这叫「登出 CSRF」，危害小但确实存在）。
    -->
    <form th:action="@{/admin/logout}" method="post" style="position:absolute;right:20px;top:22px;">
        <button type="submit" class="logout-btn-inline"
                style="background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.5);
                       border-radius:16px;padding:6px 14px;font-size:13px;cursor:pointer;">
            退出登录
        </button>
    </form>
</div>

<div class="container">

    <div class="message" th:if="${message}" th:text="${message}"></div>
    <div class="message message-error" th:if="${error}" th:text="${error}"></div>

    <div th:if="${not #lists.isEmpty(orders)}">
        <div class="order-card" th:each="order : ${orders}">

            <div class="order-header">
                <div>
                    <span class="order-number" th:text="'订单号: ' + ${order.orderNumber}">订单号</span>
                    <!--
                      #dates.format(...) 是 Thymeleaf 的日期格式化工具。
                      老代码是 ${fn:substring(order.createTime, 0, 19)} —— 直接截字符串，
                      遇到 null 会抛异常，遇到时区变化会错。
                    -->
                    <span class="order-time"
                          th:text="${order.createTime != null} ? ${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')} : ''"></span>
                </div>
                <!--
                  状态标签的 class 动态拼接：
                    th:classappend 在原有 class 后面追加
                  这里用 th:attr 拼 status-中文 这个 class，
                  这样 CSS 里就能按状态不同上色。
                  （顺便说：用中文做 class 名不严谨，真实项目里会用 status-0/1/2，
                    但这里为了不引入额外映射就先这样，阶段 4 整理时会改成数字。)
                -->
                <span class="order-status"
                      th:classappend="'status-' + ${order.statusText}"
                      th:text="${order.statusText}">状态</span>
            </div>

            <div class="order-body">
                <div class="customer-info">
                    <h4 th:text="'👤 ' + ${order.userName}">姓名</h4>
                    <p th:text="'📞 ' + ${order.userPhone}">电话</p>
                    <p th:text="'📍 ' + ${order.userAddress}">地址</p>
                </div>
                <div class="order-items">
                    <div class="order-item" th:each="item : ${order.items}">
                        <span class="item-name" th:text="${item.dishName}">菜名</span>
                        <span class="item-qty" th:text="'x' + ${item.quantity}">x1</span>
                        <span class="item-price">¥<span th:text="${item.subtotal}">0.00</span></span>
                    </div>
                </div>
            </div>

            <div class="order-footer">
                <div class="order-total">
                    合计 <strong>¥<span th:text="${order.totalPrice}">0.00</span></strong>
                </div>
                <div class="status-actions">
                    <a th:href="@{/order/{id}(id=${order.id})}" class="btn-link">查看详情</a>

                    <!-- 改状态：老代码是 GET /order?action=updateStatus，现在是 POST /order/{id}/status -->
                    <form th:action="@{/order/{id}/status(id=${order.id})}" method="post">
                        <input type="hidden" name="status" value="1">
                        <button type="submit" class="btn">标记已确认</button>
                    </form>
                    <form th:action="@{/order/{id}/status(id=${order.id})}" method="post">
                        <input type="hidden" name="status" value="2">
                        <button type="submit" class="btn">标记制作中</button>
                    </form>
                    <form th:action="@{/order/{id}/status(id=${order.id})}" method="post">
                        <input type="hidden" name="status" value="4">
                        <button type="submit" class="btn btn-primary">标记已完成</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <div class="icon">📭</div>
        <h3>还没有订单</h3>
        <p style="margin-top: 12px;">去点几道菜试试吧</p>
    </div>
</div>

</body>
</html>

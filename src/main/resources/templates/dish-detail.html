<!DOCTYPE html>
<!--
  菜品详情页
  前身：WebContent/WEB-INF/views/dish-detail.jsp（201 行）
  老地址：/dish?action=detail&id=3
  新地址：/dish/3
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${dish != null} ? ${dish.name} + ' - 菜品详情' : '菜品详情'">菜品详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #07c160 0%, #06ad56 100%); color: white; padding: 20px; text-align: center; position: relative; }
        .header h1 { font-size: 22px; font-weight: 600; }
        .back-btn { position: absolute; left: 20px; top: 24px; color: white; text-decoration: none; font-size: 16px; }
        .container { max-width: 700px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .hero { height: 200px; display: flex; align-items: center; justify-content: center; font-size: 90px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .body { padding: 24px; }
        .name { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
        .desc { color: #777; font-size: 15px; line-height: 1.8; margin-bottom: 20px; }
        .meta { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .tag { background: #f0f0f0; color: #666; padding: 5px 14px; border-radius: 14px; font-size: 13px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #e5e5e5; padding-top: 20px; }
        .price { font-size: 32px; color: #ff6b6b; font-weight: 700; }
        .price::before { content: "¥"; font-size: 18px; }
        .add-form { display: flex; gap: 10px; align-items: center; }
        .qty { width: 64px; padding: 10px; border: 2px solid #07c160; border-radius: 8px; font-size: 15px; text-align: center; }
        .add-btn { background: #07c160; color: white; border: none; padding: 12px 28px; border-radius: 25px; font-size: 16px; cursor: pointer; }
        .add-btn:hover { background: #06ad56; }
        .empty { text-align: center; padding: 80px 20px; color: #888; }
    </style>
</head>
<body>

<div class="header">
    <a th:href="@{/dish}" class="back-btn">← 返回菜单</a>
    <h1>🍜 菜品详情</h1>
</div>

<div class="container" th:if="${dish != null}">
    <!--
      ★ 提示条：别的 7 个模板都有，这里原来漏了。
      效果是「从详情页加购物车之后，看不到任何反馈」——
      因为 flash 消息被这次请求消费掉了，但这页没有显示它的地方。
    -->
    <div style="background:#e8f8ef;color:#07a052;border:1px solid #b7e8cd;padding:10px 14px;
                border-radius:8px;margin-bottom:14px;font-size:13px;"
         th:if="${message}" th:text="${message}"></div>
    <div style="background:#fdecec;color:#d63031;border:1px solid #f5c2c2;padding:10px 14px;
                border-radius:8px;margin-bottom:14px;font-size:13px;"
         th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <div class="hero" th:text="${dish.icon}">🍜</div>
        <div class="body">
            <div class="name" th:text="${dish.name}">菜名</div>
            <div class="desc" th:text="${dish.description}">描述</div>

            <div class="meta">
                <span class="tag" th:text="${dish.category}">分类</span>
                <span class="tag" th:text="'库存 ' + ${dish.stock}">库存</span>
            </div>

            <div class="price-row">
                <div class="price" th:text="${dish.price}">0.00</div>

                <!-- 加购物车同样是 POST，不是 <a href> -->
                <form class="add-form" th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="dishId" th:value="${dish.id}">
                    <input type="number" name="quantity" class="qty" value="1" min="1" max="99">
                    <button type="submit" class="add-btn">加入购物车</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="empty" th:if="${dish == null}">
    <div style="font-size:80px;">🍽️</div>
    <p>菜品不存在或已下架</p>
    <p style="margin-top:14px;"><a th:href="@{/dish}" style="color:#07c160;">返回菜单</a></p>
</div>

</body>
</html>

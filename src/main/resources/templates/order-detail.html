<!DOCTYPE html>
<!--
  订单详情
  前身：WebContent/WEB-INF/views/order-detail.jsp（249 行）
  老地址：/order?action=detail&id=5
  新地址：/order/5
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 微信点餐系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #07c160 0%, #06ad56 100%); color: white; padding: 20px; text-align: center; position: relative; }
        .header h1 { font-size: 22px; font-weight: 600; }
        .back-btn { position: absolute; left: 20px; top: 24px; color: white; text-decoration: none; font-size: 16px; }
        .container { max-width: 700px; margin: 0 auto; padding: 20px 20px 40px; }

        .message { background: #4caf50; color: white; padding: 14px 20px; border-radius: 8px; margin-bottom: 16px; text-align: center; font-size: 14px; }
        .card { background: white; border-radius: 12px; padding: 22px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 16px; }
        .status-big { text-align: center; padding: 14px 0 20px; border-bottom: 1px dashed #eee; margin-bottom: 18px; }
        .status-big .label { font-size: 13px; color: #999; margin-bottom: 6px; }
        .status-big .value { font-size: 24px; font-weight: 700; color: #e67e22; }

        .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid #f7f7f7; }
        .row:last-child { border-bottom: none; }
        .row .k { color: #888; }
        .row .v { color: #333; font-weight: 500; text-align: right; word-break: break-all; }

        .section-title { font-size: 15px; font-weight: 600; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #f0f0f0; }
        .item-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 14px; border-bottom: 1px dashed #f0f0f0; }
        .item-row:last-child { border-bottom: none; }
        .item-name { flex: 1; }
        .item-qty { color: #999; width: 60px; text-align: center; }
        .item-price { color: #ff6b6b; width: 90px; text-align: right; }

        .total-row { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; margin-top: 10px; border-top: 2px solid #f0f0f0; }
        .total-row strong { color: #ff6b6b; font-size: 26px; }

        .actions { display: flex; gap: 12px; justify-content: center; margin-top: 8px; }
        .btn { padding: 12px 28px; border-radius: 24px; border: none; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: #07c160; color: white; }
        .btn-ghost { background: #f0f0f0; color: #666; }
    </style>
</head>
<body>

<div class="header">
    <a th:href="@{/order/my}" class="back-btn">← 返回</a>
    <h1>📄 订单详情</h1>
</div>

<div class="container" th:if="${order != null}">

    <div class="message" th:if="${message}" th:text="${message}"></div>

    <div class="card">
        <div class="status-big">
            <div class="label">当前状态</div>
            <div class="value" th:text="${order.statusText}">待确认</div>
        </div>

        <div class="row">
            <span class="k">订单号</span>
            <span class="v" th:text="${order.orderNumber}">-</span>
        </div>
        <div class="row">
            <span class="k">下单时间</span>
            <span class="v"
                  th:text="${order.createTime != null} ? ${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')} : '-'">-</span>
        </div>
        <div class="row" th:if="${order.updateTime != null}">
            <span class="k">更新时间</span>
            <span class="v" th:text="${#dates.format(order.updateTime, 'yyyy-MM-dd HH:mm:ss')}">-</span>
        </div>
        <div class="row">
            <span class="k">收货人</span>
            <span class="v" th:text="${order.userName}">-</span>
        </div>
        <div class="row">
            <span class="k">联系电话</span>
            <span class="v" th:text="${order.userPhone}">-</span>
        </div>
        <div class="row">
            <span class="k">送餐地址</span>
            <span class="v" th:text="${order.userAddress}">-</span>
        </div>
    </div>

    <div class="card">
        <div class="section-title">🛒 商品明细</div>
        <div class="item-row" th:each="item : ${order.items}">
            <span class="item-name" th:text="${item.dishName}">菜名</span>
            <span class="item-qty" th:text="'x' + ${item.quantity}">x1</span>
            <span class="item-price">¥<span th:text="${item.subtotal}">0.00</span></span>
        </div>
        <div class="total-row">
            <span>合计</span>
            <strong>¥<span th:text="${order.totalPrice}">0.00</span></strong>
        </div>
    </div>

    <div class="actions">
        <a th:href="@{/order/my}" class="btn btn-ghost">返回我的订单</a>
        <a th:href="@{/dish}" class="btn btn-primary">继续点餐</a>
    </div>
</div>

<div class="container" th:if="${order == null}">
    <div class="card" style="text-align:center;padding:60px 20px;color:#888;">
        <div style="font-size:70px;">📭</div>
        <p style="margin:14px 0;">订单不存在</p>
        <a th:href="@{/order/my}" style="color:#07c160;">返回我的订单</a>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<!--
  结算 / 确认订单页
  前身：WebContent/WEB-INF/views/checkout.jsp（255 行）

  老代码的表单提交地址：
      <form action="${pageContext.request.contextPath}/order" method="post">
          <input type="hidden" name="action" value="create">
  靠一个隐藏域 action=create 告诉后端要干什么。

  新代码：
      <form th:action="@{/order/create}" method="post">
  地址本身就说明了要干什么，不需要隐藏域传 action。
  「同样的功能，少了一个隐藏字段和一层 switch」—— 这就是 URL 设计清晰的收益。
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认订单 - 微信点餐系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #07c160 0%, #06ad56 100%); color: white; padding: 20px; text-align: center; position: relative; }
        .header h1 { font-size: 22px; font-weight: 600; }
        .back-btn { position: absolute; left: 20px; top: 24px; color: white; text-decoration: none; font-size: 16px; }
        .container { max-width: 700px; margin: 0 auto; padding: 20px 20px 40px; }

        .form-section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .form-section h3 { font-size: 17px; margin-bottom: 16px; color: #333; }
        .form-group { margin-bottom: 16px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 6px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #07c160; }
        .form-group textarea { height: 80px; resize: vertical; }

        .order-item { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .order-item:last-child { border-bottom: none; }
        .item-name { flex: 1; color: #333; }
        .item-qty { color: #999; width: 60px; text-align: center; }
        .item-price { color: #ff6b6b; font-weight: 600; width: 90px; text-align: right; }

        .total-row { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; margin-top: 12px; border-top: 2px solid #f0f0f0; font-size: 16px; }
        .total-row strong { color: #ff6b6b; font-size: 25px; }

        .error-box { background: #fdecec; color: #d63031; border: 1px solid #f5c2c2; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }

        .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #07c160 0%, #06ad56 100%); color: white; border: none; border-radius: 25px; font-size: 18px; font-weight: 600; cursor: pointer; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(7, 193, 96, 0.4); }

        .tips { background: #fff9e6; border-radius: 8px; padding: 15px; margin-top: 16px; font-size: 14px; color: #666; }
        .tips strong { color: #ff6b6b; }
    </style>
</head>
<body>

<div class="header">
    <a th:href="@{/cart}" class="back-btn">← 返回</a>
    <h1>📝 确认订单</h1>
</div>

<div class="container">

    <div class="error-box" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/order/create}" method="post">

        <div class="form-section">
            <h3>👤 联系人信息</h3>
            <div class="form-group">
                <label for="userName">姓名 *</label>
                <!--
                  ★ th:value="${userName}" 是「回填」：
                  校验失败退回本页时，把用户刚才填的内容带回来，不用重输。
                  最初的版本没做回填，用户手机号输错格式就得从头再打一遍，体验很差。
                  注意这不算安全风险：Thymeleaf 的 th:value 会自动做 HTML 转义，
                  用户填的 <script> 不会被执行。
                -->
                <input type="text" id="userName" name="userName" required
                       placeholder="请输入您的姓名" th:value="${userName}">
            </div>
            <div class="form-group">
                <label for="userPhone">手机号 *</label>
                <input type="tel" id="userPhone" name="userPhone" required
                       placeholder="请输入您的手机号" pattern="[0-9]{11}" title="请输入 11 位手机号"
                       th:value="${userPhone}">
            </div>
            <div class="form-group">
                <label for="userAddress">送餐地址 *</label>
                <textarea id="userAddress" name="userAddress" required
                          placeholder="请输入详细的送餐地址，包括楼栋、单元、门牌号等"
                          th:text="${userAddress}"></textarea>
            </div>
        </div>

        <div class="form-section">
            <h3>🛒 订单详情</h3>
            <div class="order-item" th:each="item : ${cart.items}">
                <span class="item-name" th:text="${item.dish.name}">菜名</span>
                <span class="item-qty" th:text="'x' + ${item.quantity}">x1</span>
                <span class="item-price">¥<span th:text="${item.subtotal}">0.00</span></span>
            </div>
            <div class="total-row">
                <span>合计（<span th:text="${cart.totalQuantity}">0</span> 件）</span>
                <strong>¥<span th:text="${cart.totalPrice}">0.00</span></strong>
            </div>
        </div>

        <button type="submit" class="submit-btn">提交订单</button>
    </form>

    <div class="tips">
        <strong>提示：</strong>提交后系统会生成订单号，你可以在「我的订单」里查看进度。
        本次为演示环境，不会真实扣款。
    </div>
</div>

</body>
</html>
